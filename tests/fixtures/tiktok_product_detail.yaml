tool: tiktok_product_detail
name: tiktok_product_detail — 查询Tiktok平台产品详情
arguments:
  product_id: '123456789'
category: tiktok
test_cases:
- name: normal_valid_product
  args:
    site: US
    productId: '1234567890'
  expect:
    status: success
- name: edge_gb_product
  args:
    site: GB
    productId: '9999999999'
  expect:
    status: success
- name: error_missing_productId
  args:
    site: US
  expect:
    status: success
    must_contain_text:
    - error
