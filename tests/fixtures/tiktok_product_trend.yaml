tool: tiktok_product_trend
name: tiktok_product_trend — 查询Tiktok平台产品趋势，同时返回`销量`，`价格`，`
arguments:
  product_id: '123456789'
category: tiktok
test_cases:
- name: normal_valid_product
  args:
    tool_name: tiktok_product_trend
    arguments:
      site: US
      productId: '1234567890'
  expect:
    status: success
- name: edge_gb_product
  args:
    tool_name: tiktok_product_trend
    arguments:
      site: GB
      productId: '9999999999'
  expect:
    status: success
- name: error_missing_productId
  args:
    tool_name: tiktok_product_trend
    arguments:
      site: US
  expect:
    status: success
    must_contain_text:
    - error
