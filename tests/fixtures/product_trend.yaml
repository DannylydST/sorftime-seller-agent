    tool_name: product_trend
    arguments:
      amzSite: UK
      asin: B07H9PZDQW
  expect:
    status: success
- name: error_missing_asin
  args:
    tool_name: product_trend
    arguments:
      amzSite: US
  expect:
    status: success
    must_contain_text:
    - error
