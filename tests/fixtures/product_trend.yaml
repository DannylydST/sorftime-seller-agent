tool: product_trend
name: product_trend — 查询亚马逊电商平台产品的历史趋势数据，支持月销量/月销额/价
arguments:
  asin: B07H9PZDQW
  amz_site: US
category: amazon
test_cases:
- name: normal_valid_asin
  args:
    tool_name: product_trend
