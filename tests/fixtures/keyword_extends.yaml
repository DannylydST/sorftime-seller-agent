tool: keyword_extends
name: keyword_extends — 查询亚马逊电商平台上热搜关键词的延伸词关键词，可用于卖家查询
arguments:
  keyword: yoga mat
category: amazon
test_cases:
- name: normal_kitchen_storage
  args:
    amzSite: US
    keyword: kitchen storage
  expect:
    status: error_or_empty
- name: edge_uk_keyword
  args:
    amzSite: UK
    keyword: yoga pants
  expect:
    status: error_or_empty
- name: error_missing_keyword
  args:
    amzSite: US
  expect:
    status: success
    must_contain_text:
    - error
