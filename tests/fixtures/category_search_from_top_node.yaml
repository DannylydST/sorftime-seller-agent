tool: category_search_from_top_node
name: category_search_from_top_node — 按指定大品类（如汽车用品，家居用品）搜索亚马逊电商平台上相关
arguments:
  top_node: 1
category: amazon
test_cases:
- name: normal_node
  args:
    amzSite: US
    nodeId: '1040668'
  expect:
    status: success
- name: edge_uk_node
  args:
    amzSite: UK
    nodeId: '0'
  expect:
    status: success
- name: error_missing_nodeId
  args:
    amzSite: US
  expect:
    status: success
    must_contain_text:
    - error
