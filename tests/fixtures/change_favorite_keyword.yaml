tool: change_favorite_keyword
name: change_favorite_keyword — 移动我的亚马逊平台关键词词库中收藏的关键词到指定收藏夹，如果
arguments:
  keyword: yoga mat
  to_dict: test
category: amazon
test_cases:
- name: normal_change
  args:
    tool_name: change_favorite_keyword
    arguments:
      amzSite: US
      oldKeyword: kitchen storage
      newKeyword: home organization
  expect:
    status: success
- name: edge_uk
  args:
    tool_name: change_favorite_keyword
    arguments:
      amzSite: UK
      oldKeyword: yoga pants
      newKeyword: fitness leggings
  expect:
    status: success
- name: error_missing_oldKeyword
  args:
    tool_name: change_favorite_keyword
    arguments:
      amzSite: US
      newKeyword: home organization
  expect:
    status: success
    must_contain_text:
    - error
