tool: tiktok_product_video_author
name: tiktok_product_video_author — 查询Tiktok平台产品的带货达人
arguments:
  product_id: '123456789'
category: tiktok
test_cases:
- name: normal_valid_author
  args:
    tool_name: tiktok_product_video_author
    arguments:
      site: US
      authorId: '1234567890'
  expect:
    status: success
- name: edge_gb_author
  args:
    tool_name: tiktok_product_video_author
    arguments:
      site: GB
      authorId: '9999999999'
  expect:
    status: success
- name: error_missing_authorId
  args:
    tool_name: tiktok_product_video_author
    arguments:
      site: US
  expect:
    status: success
    must_contain_text:
    - error
